<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Step Carousel</title>
<style>
  :root {
    --ink: #111;
    --muted: #777;
    --ratio-w: 4;
    --ratio-h: 5;
    --bottom: 76px;   /* 캡션 + 안내문 높이 */
    --gap: 72px;
    --pad: 64px;      /* 왼쪽 여백 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; overflow: hidden; }

  .carousel { position: relative; height: calc(100% - 32px); padding-left: var(--pad); overflow: hidden; }
  .track { display: flex; gap: var(--gap); height: 100%;
    transition: transform .45s cubic-bezier(.22,.61,.36,1);
    cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .track.dragging { transition: none; cursor: grabbing; }

  /* 이미지 크기는 iframe 높이와 폭 중 작은 쪽에 맞춤 → 여백 없이 꽉 참 */
  .slide { flex: 0 0 auto;
    width: min(64vw, calc((100vh - var(--bottom)) * var(--ratio-w) / var(--ratio-h))); }
  .slide img { display: block; width: 100%; aspect-ratio: var(--ratio-w) / var(--ratio-h);
    object-fit: cover; background: #eee; pointer-events: none; -webkit-user-drag: none; }
  .caption { margin-top: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .arrow { position: absolute; top: var(--arrow-top, 50%); transform: translateY(-50%);
    width: 40px; height: 40px; padding: 0; border: 1px solid var(--ink); border-radius: 0;
    background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 2; transition: opacity .2s; }
  .arrow svg { width: 14px; height: 14px; }
  .prev { left: 12px; }
  .next { right: 24px; }
  .arrow[disabled] { opacity: 0; pointer-events: none; }

  .hint { position: absolute; left: 0; bottom: 6px; margin: 0; padding-left: 24px; font-size: 13px; color: var(--muted); }

  @media (max-width: 600px) {
    :root { --gap: 20px; --pad: 16px; }
    .slide { width: min(78vw, calc((100vh - var(--bottom)) * var(--ratio-w) / var(--ratio-h))); }
    .prev { left: 6px; }
    .next { right: 6px; }
    .hint { padding-left: 16px; }
  }
</style>
</head>
<body>

<div class="carousel" id="carousel">
  <div class="track" id="track"></div>
  <button type="button" class="arrow prev" id="prev" aria-label="이전">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button type="button" class="arrow next" id="next" aria-label="다음">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>
<p class="hint" id="hint"></p>

<script>
/*
  URL 파라미터로 내용을 바꿉니다 (페이지를 다시 배포할 필요 없음).
    img   : 이미지 주소 (여러 번 반복)
    cap   : 캡션 (img 순서대로 반복)
    hint  : 하단 안내문 (빈 값이면 숨김)
    ratio : 이미지 비율, 예) 4:5, 3:4, 1:1  (기본 4:5)
  예) ?img=https://a.jpg&cap=첫단계&img=https://b.jpg&cap=둘째단계&hint=드래그해보세요
*/
(function () {
  var p = new URLSearchParams(location.search);
  var imgs = p.getAll('img');
  var caps = p.getAll('cap');
  if (!imgs.length) {
    imgs = ['https://picsum.photos/id/1027/600/800', 'https://picsum.photos/id/1011/600/800',
            'https://picsum.photos/id/1005/600/800', 'https://picsum.photos/id/1062/600/800'];
    caps = ['1단계', '2단계', '3단계', '4단계'];
  }
  var ratio = (p.get('ratio') || '4:5').split(':');
  if (ratio.length === 2 && +ratio[0] > 0 && +ratio[1] > 0) {
    document.documentElement.style.setProperty('--ratio-w', ratio[0]);
    document.documentElement.style.setProperty('--ratio-h', ratio[1]);
  }

  var track = document.getElementById('track');
  imgs.forEach(function (src, i) {
    var slide = document.createElement('div'); slide.className = 'slide';
    var img = document.createElement('img'); img.src = src; img.alt = caps[i] || '';
    var cap = document.createElement('div'); cap.className = 'caption';
    cap.textContent = caps[i] || '';
    slide.appendChild(img); slide.appendChild(cap); track.appendChild(slide);
  });

  var hintEl = document.getElementById('hint');
  var hint = p.has('hint') ? p.get('hint') : '화살표나 드래그로 ' + imgs.length + '단계를 확인하세요';
  if (hint) hintEl.textContent = hint; else { hintEl.remove(); document.documentElement.style.setProperty('--bottom', '44px'); }

  var carousel = document.getElementById('carousel');
  var slides = Array.prototype.slice.call(track.children);
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var index = 0, startX = 0, dx = 0, dragging = false;

  function step() { return slides[0].offsetWidth + (parseFloat(getComputedStyle(track).columnGap) || 0); }
  function offset() { return -index * step(); }
  function update() {
    track.style.transform = 'translateX(' + offset() + 'px)';
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === slides.length - 1;
    var img = slides[0].querySelector('img');
    if (img.offsetHeight) carousel.style.setProperty('--arrow-top', img.offsetHeight / 2 + 'px');
  }
  function go(i) { index = Math.max(0, Math.min(slides.length - 1, i)); update(); }

  prevBtn.addEventListener('click', function () { go(index - 1); });
  nextBtn.addEventListener('click', function () { go(index + 1); });

  track.addEventListener('pointerdown', function (e) {
    dragging = true; startX = e.clientX; dx = 0;
    track.classList.add('dragging');
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    dx = e.clientX - startX;
    var edge = (index === 0 && dx > 0) || (index === slides.length - 1 && dx < 0);
    track.style.transform = 'translateX(' + (offset() + (edge ? dx * 0.3 : dx)) + 'px)';
  });
  function end() {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('dragging');
    var t = step() * 0.2;
    if (dx < -t) go(index + 1);
    else if (dx > t) go(index - 1);
    else update();
  }
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(index - 1);
    if (e.key === 'ArrowRight') go(index + 1);
  });
  window.addEventListener('resize', update);
  window.addEventListener('load', update);
  update();
})();
</script>
</body>
</html>
